<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2a21" />
  <title>Sem conexão · FinOps</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box;
      background: #e8efec; color: #12211b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 22rem; }
    img { width: 5rem; height: 5rem; border-radius: 1.2rem; }
    h1 { font-size: 1.4rem; margin: 1rem 0 0.5rem; }
    p { color: #5a6b64; line-height: 1.5; margin: 0 0 1.25rem; }
    button { font: inherit; font-weight: 600; padding: 0.8rem 1.4rem; border: 0; border-radius: 0.8rem; background: #14513f; color: #fff; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Sem conexão</h1>
    <p>Seus números ficam no servidor, então preciso de internet para mostrar e salvar. Tente de novo quando a rede voltar.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
