stages:
  - test

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

test:
  stage: test
  image: node:22-alpine
  rules:
    - if: $CI_PIPELINE_SOURCE
  script:
    - npm ci
    - npm test
    - npm run lint
  artifacts:
    when: on_failure
    expire_in: 3 days
    paths:
      - npm-debug.log
