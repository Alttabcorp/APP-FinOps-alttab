<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Financeiro Mensal - Alttab Corp</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Painel Financeiro Mensal</h1>
    </header>

    <main>
        <div class="container">
            <section class="card">
                <h2>Entrada de Dados</h2>
                <form id="financialForm">
                    <div class="form-group">
                        <label for="valorRecebido">Valor Total Recebido:</label>
                        <input type="number" id="valorRecebido" required step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="custoAgua">Água:</label>
                        <input type="number" id="custoAgua" required step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="custoEnergia">Energia:</label>
                        <input type="number" id="custoEnergia" required step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="custoAluguel">Aluguel:</label>
                        <input type="number" id="custoAluguel" required step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="custoInternet">Internet:</label>
                        <input type="number" id="custoInternet" required step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="gastoCartao">Gastos no Cartão:</label>
                        <input type="number" id="gastoCartao" required step="0.01">
                    </div>
                </form>
            </section>

            <section class="card">
                <h2>Resumo Financeiro</h2>
                <div class="resumo">
                    <div class="resumo-item">
                        <h3>Receita Total</h3>
                        <p id="receitaTotal">R$ 0,00</p>
                    </div>
                    <div class="resumo-item">
                        <h3>Poupança (10%)</h3>
                        <p id="poupanca">R$ 0,00</p>
                    </div>
                    <div class="resumo-item">
                        <h3>Sociedade</h3>
                        <p id="sociedade">R$ 100,00</p>
                    </div>
                    <div class="resumo-item">
                        <h3>Custos Fixos</h3>
                        <p id="custosFixos">R$ 0,00</p>
                    </div>
                    <div class="resumo-item">
                        <h3>Gastos Variáveis</h3>
                        <p id="gastosVariaveis">R$ 0,00</p>
                    </div>
                    <div class="resumo-item">
                        <h3>Saldo Final</h3>
                        <p id="saldoFinal">R$ 0,00</p>
                    </div>
                </div>
            </section>
        </div>

        <section class="card" style="margin-top: 2rem;">
            <h2>Distribuição dos Valores</h2>
            <canvas id="grafico"></canvas>
        </section>
    </main>

    <footer>
        <p>Alttab Corp © 2025</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
