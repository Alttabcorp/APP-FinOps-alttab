<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Modal - Abas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="padding: 20px;">
    <h1>Teste do Modal e Abas</h1>
    <button id="openConfigBtn" class="btn">Abrir Modal</button>

    <!-- Modal de Configurações -->
    <div id="configModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Configurações</h2>
            
            <!-- Abas -->
            <div class="tab-container">
                <div class="tab-buttons">
                    <button class="tab-btn active" data-tab="receitas">Receitas</button>
                    <button class="tab-btn" data-tab="despesas">Despesas</button>
                    <button class="tab-btn" data-tab="gerenciamento">Gerenciamento</button>
                </div>
                
                <div class="tab-content">
                    <div id="receitas" class="tab-pane active">
                        <h3>Aba Receitas</h3>
                        <p>Conteúdo da aba de receitas</p>
                    </div>
                    
                    <div id="despesas" class="tab-pane">
                        <h3>Aba Despesas</h3>
                        <p>Conteúdo da aba de despesas</p>
                    </div>
                    
                    <div id="gerenciamento" class="tab-pane">
                        <h3>Aba Gerenciamento</h3>
                        <p>Conteúdo da aba de gerenciamento</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Elementos
        const configModal = document.getElementById('configModal');
        const openConfigBtn = document.getElementById('openConfigBtn');
        const closeBtn = document.querySelector('.close');

        // Funções
        const abrirModal = () => {
            console.log('Abrindo modal...');
            configModal.style.display = 'block';
        };

        const fecharModal = () => {
            console.log('Fechando modal...');
            configModal.style.display = 'none';
        };

        const alternarAba = (tabName) => {
            console.log('Alternando para aba:', tabName);
            
            // Remover classe active de todas as abas
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelectorAll('.tab-pane').forEach(pane => {
                pane.classList.remove('active');
            });

            // Adicionar classe active na aba selecionada
            const btnSelecionado = document.querySelector(`[data-tab="${tabName}"]`);
            const painelSelecionado = document.getElementById(tabName);
            
            if (btnSelecionado) {
                btnSelecionado.classList.add('active');
                console.log('Botão ativado:', tabName);
            }
            
            if (painelSelecionado) {
                painelSelecionado.classList.add('active');
                console.log('Painel ativado:', tabName);
            }
        };

        // Event listeners
        openConfigBtn.addEventListener('click', abrirModal);
        closeBtn.addEventListener('click', fecharModal);
        
        window.addEventListener('click', (event) => {
            if (event.target === configModal) {
                fecharModal();
            }
        });

        // Adicionar listeners às abas
        document.querySelectorAll('.tab-btn').forEach(btn => {
            const tabName = btn.getAttribute('data-tab');
            console.log('Adicionando listener para:', tabName);
            btn.addEventListener('click', () => {
                console.log('Clique na aba:', tabName);
                alternarAba(tabName);
            });
        });

        console.log('Teste carregado! Clique no botão para abrir o modal.');
    </script>
</body>
</html>
